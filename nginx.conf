server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck de Coolify y fallback de la landing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    # webp y woff2 ya vienen comprimidos, no se recomprimen
    gzip_types text/css image/svg+xml;
}
