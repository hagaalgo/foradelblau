<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Popina · Carta</title>
<meta name="description" content="Consulta nuestra carta: take away, desayunos y entrepanes de la semana.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Popina · Carta">
<meta property="og:image" content="assets/bg-desktop.webp"><!-- TODO: URL absoluta al publicar -->

<link rel="preload" href="assets/gibson-thin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/bg-mobile.webp" as="image" media="(max-width: 899px)">

<style>
@font-face{
  font-family:"Gibson Thin";
  src:url("assets/gibson-thin.woff2") format("woff2");
  font-weight:100; font-style:normal; font-display:swap;
}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{
  min-height:100vh; min-height:100dvh; background:#000; color:#fff;
  font-family:"Gibson Thin","Lato","Helvetica Neue",Arial,sans-serif; font-weight:100;
  -webkit-font-smoothing:antialiased;
}
.hero{position:relative; min-height:100vh; min-height:100dvh; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end}
.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 50%; z-index:0}
.hero::after{ /* degradado para legibilidad de la fuente fina */
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(to top, rgba(0,0,0,.7) 0%, rgba(0,0,0,.35) 35%, transparent 60%);
}
.menu{
  position:relative; z-index:2; width:100%; max-width:380px; margin:0 auto;
  padding:0 24px calc(48px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:32px; list-style:none;
}
.menu a{
  display:flex; align-items:center; height:48px; padding:0 20px;
  border:1.5px solid rgba(255,255,255,.9); border-radius:999px;
  color:#fff; text-decoration:none; font-size:18px; letter-spacing:.1em; white-space:nowrap;
  transition:background .2s, color .2s;
}
.menu a:hover{background:rgba(255,255,255,.14)}
.menu a:active{background:#fff; color:#000}
.menu a:focus-visible{outline:2px solid #fff; outline-offset:4px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (max-width:360px){ .menu{gap:24px} .menu a{font-size:16px; letter-spacing:.08em} }
@media (min-width:900px){ .bg{object-position:50% 35%} .menu{padding-bottom:64px} }

/* Panel off-canvas: la carta se abre encima de la portada, sin salir del sitio */
.panel{position:fixed; inset:0; z-index:20; visibility:hidden; transition:visibility 0s .4s}
.panel[data-open="true"]{visibility:visible; transition-delay:0s}
.panel__backdrop{
  position:absolute; inset:0; background:rgba(0,0,0,.65);
  opacity:0; transition:opacity .3s; cursor:pointer;
}
.panel[data-open="true"] .panel__backdrop{opacity:1}
.panel__sheet{
  position:absolute; top:0; right:0; bottom:0; width:min(760px,100%);
  display:flex; flex-direction:column; background:#0b0b0b;
  border-left:1px solid rgba(255,255,255,.14);
  transform:translateX(100%); transition:transform .4s cubic-bezier(.22,.61,.36,1);
}
.panel[data-open="true"] .panel__sheet{transform:translateX(0)}
.panel__bar{
  flex:none; display:flex; align-items:center; gap:14px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px 20px;
  border-bottom:1px solid rgba(255,255,255,.14);
}
.panel__title{font-size:15px; font-weight:100; letter-spacing:.16em; text-transform:uppercase; margin-right:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.panel__direct{display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; font-size:13px; color:rgba(255,255,255,.72); letter-spacing:.04em; text-underline-offset:3px}
.panel__direct:hover{color:#fff}
.panel__close{
  flex:none; width:44px; height:44px; display:grid; place-items:center;
  background:transparent; border:1px solid rgba(255,255,255,.4); border-radius:999px;
  color:#fff; font:inherit; font-size:22px; line-height:1; cursor:pointer;
}
.panel__close:hover{background:rgba(255,255,255,.14)}
.panel__direct:focus-visible,.panel__close:focus-visible{outline:2px solid #fff; outline-offset:3px}
.panel__body{flex:1; min-height:0; background:#1a1a1a}
.panel__frame{display:block; width:100%; height:100%; border:0; background:#fff}
body.is-locked{overflow:hidden}
@media (prefers-reduced-motion:reduce){
  .menu a,.panel,.panel__backdrop,.panel__sheet{transition:none}
}
</style>
</head>
<body>
<main class="hero">
  <h1 class="sr-only">Popina</h1>
  <picture>
    <source media="(min-width:900px)" srcset="assets/bg-desktop.webp">
    <img class="bg" src="assets/bg-mobile.webp" alt="" fetchpriority="high" decoding="async">
  </picture>

  <ul class="menu">
    <li><a href="cartas/take-away.html" data-carta="cartas/take-away.html" data-title="Take away" data-pdf="assets/take-away.pdf" target="_blank" rel="noopener">Take away</a></li>
    <li><a href="cartas/desayunos.html" data-carta="cartas/desayunos.html" data-title="Desayunos" data-pdf="assets/desayunos.pdf" target="_blank" rel="noopener">Desayunos</a></li>
    <!-- TODO: falta la carta de entrepanes -->
    <li><a href="#entrepanes">Entrepanes de la semana</a></li>
  </ul>
</main>

<div class="panel" id="carta-panel" data-open="false" aria-hidden="true">
  <div class="panel__backdrop" data-close></div>
  <section class="panel__sheet" role="dialog" aria-modal="true" aria-labelledby="carta-panel-title">
    <header class="panel__bar">
      <h2 class="panel__title" id="carta-panel-title">Carta</h2>
      <a class="panel__direct" id="carta-panel-direct" href="cartas/take-away.html" target="_blank" rel="noopener">Abrir</a>
      <a class="panel__direct" id="carta-panel-pdf" href="assets/take-away.pdf" target="_blank" rel="noopener">PDF</a>
      <button class="panel__close" type="button" data-close aria-label="Cerrar la carta">&#215;</button>
    </header>
    <div class="panel__body">
      <iframe class="panel__frame" id="carta-panel-frame" title="Carta"></iframe>
    </div>
  </section>
</div>

<script>
(function () {
  var panel = document.getElementById('carta-panel');
  var frame = document.getElementById('carta-panel-frame');
  var titleEl = document.getElementById('carta-panel-title');
  var direct = document.getElementById('carta-panel-direct');
  var pdf = document.getElementById('carta-panel-pdf');
  var sheet = panel.querySelector('.panel__sheet');
  var closeBtn = panel.querySelector('.panel__close');
  var lastFocus = null;
  var pushed = false;
  var pendingBack = 0;
  var currentSrc = '';

  // Navegar el iframe con location.replace evita que cada carta añada una
  // entrada de historial propia y se coma el "atrás" del panel.
  function loadCarta(page) {
    var url = page + '?embed=1';
    if (url === currentSrc) return;
    currentSrc = url;
    var win = frame.contentWindow;
    var blank = true;
    try { blank = !win.location.href || win.location.href === 'about:blank'; } catch (err) { blank = true; }
    if (blank) {
      frame.setAttribute('src', url);
      return;
    }
    try { win.location.replace(url); } catch (err) { frame.setAttribute('src', url); }
  }

  function open(link) {
    var page = link.getAttribute('data-carta');
    loadCarta(page);
    var title = link.getAttribute('data-title');
    frame.setAttribute('title', title + ', carta');
    titleEl.textContent = title;
    direct.setAttribute('href', page);
    pdf.setAttribute('href', link.getAttribute('data-pdf'));
    lastFocus = link;
    panel.setAttribute('data-open', 'true');
    panel.removeAttribute('aria-hidden');
    document.body.classList.add('is-locked');
    closeBtn.focus();
    if (!pushed) { history.pushState({ panel: true }, ''); pushed = true; }
  }

  function close(fromHistory) {
    panel.setAttribute('data-open', 'false');
    panel.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('is-locked');
    if (lastFocus) lastFocus.focus();
    if (!fromHistory && pushed) { pushed = false; pendingBack++; history.back(); }
  }

  window.addEventListener('popstate', function () {
    // El `history.back()` que lanzamos nosotros no debe cerrar un panel reabierto.
    if (pendingBack > 0) { pendingBack--; return; }
    if (!pushed) return;
    pushed = false;
    close(true);
  });

  Array.prototype.forEach.call(document.querySelectorAll('a[data-carta]'), function (link) {
    link.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      open(link);
    });
  });

  panel.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) close();
  });

  document.addEventListener('keydown', function (e) {
    if (panel.getAttribute('data-open') !== 'true') return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key !== 'Tab') return;
    var f = sheet.querySelectorAll('a[href], button:not([disabled])');
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
})();
</script>
</body>
</html>
